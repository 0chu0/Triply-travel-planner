version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_backend
    restart: unless-stopped
    env_file:
      - .env                     # 注入 APP_PORT=8000 / POSTGRES_* / REDIS_* / 各 API Key / Langfuse
    environment:
      # 2026-10-10 修复：容器默认是 UTC，datetime.now() 比北京时间晚 8 小时，
      # get_today_date 在北京时间 00:00-08:00 之间会返回"昨天"，日志时间戳也对不上。
      # 设了 TZ 之后，naive datetime.now() 与日志时间都按北京时间走。
      - TZ=Asia/Shanghai
    network_mode: host           # 后端通过 localhost 直连同主机的 postgres/redis
    volumes:
      - ./data:/app/data         # RAG 文档 + 预建 chroma 向量库
      - ./logs:/app/logs         # 日志落盘，对应 logger.py 写 logs/
      - ./frontend:/app/frontend # 前端热更新挂载：改前端只需 force-recreate，免重建镜像
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
